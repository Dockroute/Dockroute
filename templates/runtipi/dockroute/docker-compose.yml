services:
  dockroute:
    image: ghcr.io/dockroute/dockroute:latest
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
    environment:
      - DOCKROUTE_PROVIDER=${DOCKROUTE_PROVIDER}
      - DOCKROUTE_OWNER_ID=${DOCKROUTE_OWNER_ID}
      - DOCKROUTE_POLICY=${DOCKROUTE_POLICY}
      - DOCKROUTE_DELETE_GRACE_SECONDS=${DOCKROUTE_DELETE_GRACE_SECONDS}
      - DOCKROUTE_DEFAULT_TARGET=${DOCKROUTE_DEFAULT_TARGET}
      - DOCKROUTE_DOMAIN_FILTER=${DOCKROUTE_DOMAIN_FILTER}
      - DOCKROUTE_RESYNC_SECONDS=${DOCKROUTE_RESYNC_SECONDS}
      - CLOUDFLARE_API_TOKEN=${CLOUDFLARE_API_TOKEN}
      - CLOUDFLARE_ACCOUNT_ID=${CLOUDFLARE_ACCOUNT_ID}
      - CLOUDFLARE_TUNNEL_ID=${CLOUDFLARE_TUNNEL_ID}
    x-runtipi:
      internal_port: 8099
      is_main: true
x-runtipi:
  schema_version: 2
