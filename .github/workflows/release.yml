name: Release

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release
  cancel-in-progress: false

env:
  IMAGE: ghcr.io/${{ github.repository_owner }}/dockroute

jobs:
  verify:
    name: Lint, typecheck & test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      # The Dockerfile is the single source of truth for the Bun version, so the
      # suite runs on the same runtime the published image ships.
      - name: Resolve Bun version from the Dockerfile
        id: bun
        run: |
          version=$(sed -n 's|^FROM oven/bun:\([^@ ]*\).*|\1|p' Dockerfile | head -1)
          [ -n "$version" ] || { echo "::error::could not read the Bun version from the Dockerfile"; exit 1; }
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ steps.bun.outputs.version }}

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Lint
        run: bun run lint

      - name: Typecheck
        run: bun run typecheck

      - name: Test
        run: bun test

  release:
    name: Semantic release
    runs-on: ubuntu-latest
    needs: verify
    permissions:
      contents: read
    env:
      # Single source of truth: the dry run that guards the notes and the real
      # release must resolve the exact same plugin tree, or the guard proves
      # nothing about what ships.
      #
      # Stay on the conventionalcommits 9.x line. The 10.x line requires
      # conventional-changelog-writer@9, while semantic-release 25 resolves
      # writer 8 via @semantic-release/release-notes-generator@14 (^8.0.0).
      # On 10.2.x/10.3.x that mismatch renders empty release notes without an
      # error, which is how v0.1.1 through v0.3.1 shipped with no body (#44).
      # Move past 9.x only once release-notes-generator depends on writer@9.
      RELEASE_PLUGINS: |
        @semantic-release/changelog@7
        @semantic-release/git@11
        conventional-changelog-conventionalcommits@9.3.1
    outputs:
      published: ${{ steps.semantic.outputs.new_release_published }}
      version: ${{ steps.semantic.outputs.new_release_version }}
      git_tag: ${{ steps.semantic.outputs.new_release_git_tag }}
    steps:
      # The release commit and tag are pushed as the dockroute-release-bot
      # GitHub App, which has bypass on the protect-main ruleset.
      - name: Mint release bot token
        id: app-token
        uses: actions/create-github-app-token@v3
        with:
          app-id: ${{ secrets.RELEASE_APP_ID }}
          private-key: ${{ secrets.RELEASE_APP_PRIVATE_KEY }}

      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          token: ${{ steps.app-token.outputs.token }}

      # Empty release notes fail nothing on their own, so they went unnoticed for
      # six releases. Generating them once in dry-run mode turns that into a red
      # build before anything is tagged or published.
      - name: Dry run to generate the release notes
        id: dry_run
        uses: cycjimmy/semantic-release-action@v6
        with:
          dry_run: true
          extra_plugins: ${{ env.RELEASE_PLUGINS }}
        env:
          GITHUB_TOKEN: ${{ steps.app-token.outputs.token }}

      - name: Fail on empty release notes
        if: steps.dry_run.outputs.new_release_published == 'true'
        env:
          # Read through the environment, never interpolated into the script.
          NOTES: ${{ steps.dry_run.outputs.new_release_notes }}
        run: |
          # Line 1 is the version header, which renders even when every commit
          # section is missing. The body is what proves the writer ran.
          if [ -z "$(printf '%s' "$NOTES" | tail -n +2 | tr -d '[:space:]')" ]; then
            echo "::error::semantic-release generated release notes with no body. \
          The conventionalcommits preset and conventional-changelog-writer are \
          probably out of step again; see issue #44."
            exit 1
          fi
          echo "Release notes carry a body."

      - name: Run semantic-release
        id: semantic
        uses: cycjimmy/semantic-release-action@v6
        with:
          extra_plugins: ${{ env.RELEASE_PLUGINS }}
        env:
          GITHUB_TOKEN: ${{ steps.app-token.outputs.token }}

  publish:
    name: Publish image to GHCR
    runs-on: ubuntu-latest
    needs: release
    if: needs.release.outputs.published == 'true'
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.release.outputs.git_tag }}

      - uses: docker/setup-qemu-action@v4

      - uses: docker/setup-buildx-action@v4

      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build local image for scan
        uses: docker/build-push-action@v7
        with:
          context: .
          push: false
          load: true
          tags: dockroute:release-scan
          cache-from: type=gha
          cache-to: type=gha,mode=max
          # Never cache the release stage: its apt-get upgrade must see new CVE fixes
          no-cache-filters: release

      - name: Scan image with Trivy (gate)
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: dockroute:release-scan
          format: table
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          exit-code: "1"

      - name: Image metadata
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.IMAGE }}
          tags: |
            type=semver,pattern={{version}},value=${{ needs.release.outputs.git_tag }}
            type=semver,pattern={{major}}.{{minor}},value=${{ needs.release.outputs.git_tag }}
            type=raw,value=latest

      - name: Build and push (amd64 + arm64)
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          # Never cache the release stage: its apt-get upgrade must see new CVE fixes
          no-cache-filters: release
