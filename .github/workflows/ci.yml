name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    name: Lint, typecheck & test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      # The Dockerfile is the single source of truth for the Bun version, so the
      # suite runs on the same runtime the published image ships.
      - name: Resolve Bun version from the Dockerfile
        id: bun
        run: |
          version=$(sed -n 's|^FROM oven/bun:\([^@ -]*\).*|\1|p' Dockerfile | head -1)
          [ -n "$version" ] || { echo "::error::could not read the Bun version from the Dockerfile"; exit 1; }
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ steps.bun.outputs.version }}

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Lint
        run: bun run lint

      - name: Typecheck
        run: bun run typecheck

      - name: Test (with coverage)
        run: bun test --coverage --coverage-reporter=lcov

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v7
        with:
          files: coverage/lcov.info
          fail_ci_if_error: false

  docker:
    name: Docker build & scan
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@v7

      - uses: docker/setup-buildx-action@v4

      # Releases rewrite x-casaos.version in this file (#49); keep it a valid
      # compose file so the store never receives a broken template.
      - name: Validate the CasaOS template
        run: docker compose -f templates/casaos/dockroute/docker-compose.yml config -q

      - name: Build image (no push)
        uses: docker/build-push-action@v7
        with:
          context: .
          push: false
          load: true
          tags: dockroute:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max
          # Never cache the release stage: its apk upgrade must see new CVE fixes
          no-cache-filters: release

      - name: Scan image with Trivy
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: dockroute:ci
          format: sarif
          output: trivy.sarif
          severity: CRITICAL,HIGH
          trivyignores: .trivyignore.yaml

      - name: Upload Trivy results to GitHub Security
        uses: github/codeql-action/upload-sarif@v4
        if: always()
        with:
          sarif_file: trivy.sarif
          category: trivy-image

      # Unfixed CVEs fail too: an unfixed HIGH must be either removed from the
      # image or accepted on purpose in .trivyignore.yaml, never pass quietly.
      - name: Fail on CRITICAL/HIGH vulnerabilities, fixed or not
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: dockroute:ci
          format: table
          severity: CRITICAL,HIGH
          trivyignores: .trivyignore.yaml
          exit-code: "1"

  integration:
    name: Integration (socket proxy)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: docker/setup-buildx-action@v4

      - name: Build image (no push)
        uses: docker/build-push-action@v7
        with:
          context: .
          push: false
          load: true
          tags: dockroute:ci
          cache-from: type=gha

      # The image must boot to its startup line, and refuse a CPU without
      # SSE4.2/POPCNT up front instead of hanging inside Bun.
      - name: Boot smoke test
        run: test/integration/boot-smoke.sh dockroute:ci

      # Proves the smoke test catches a stuck boot: an image whose entrypoint
      # spins forever, like Bun did on a kvm64 CPU, must make it fail, and for
      # that reason: a broken build or run must not turn this step green.
      - name: Boot smoke test fails on a stuck boot
        run: |
          printf 'FROM dockroute:ci\nENTRYPOINT ["sh", "-c", "while :; do :; done"]\n' |
            docker build -q -t dockroute:stuck - >/dev/null
          if out="$(BOOT_TIMEOUT=10 test/integration/boot-smoke.sh dockroute:stuck 2>&1)"; then
            echo "$out"
            echo "::error::the boot smoke test passed on an image that never boots"
            exit 1
          fi
          echo "$out"
          echo "$out" | grep -qF "the boot is stuck" || {
            echo "::error::the boot smoke test failed, but not because the boot is stuck"
            exit 1
          }

      # Runs the README's socket-proxy compose example against the runner's
      # Docker engine: discovery through the proxy, no Docker group for the
      # app, and every endpoint beyond the three DockRoute uses denied.
      - name: Socket-proxy end-to-end check
        run: test/integration/socket-proxy.sh
