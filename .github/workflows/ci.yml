name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    name: Lint, typecheck & test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      # The Dockerfile is the single source of truth for the Bun version, so the
      # suite runs on the same runtime the published image ships.
      - name: Resolve Bun version from the Dockerfile
        id: bun
        run: |
          version=$(sed -n 's|^FROM oven/bun:\([^@ ]*\).*|\1|p' Dockerfile | head -1)
          [ -n "$version" ] || { echo "::error::could not read the Bun version from the Dockerfile"; exit 1; }
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ steps.bun.outputs.version }}

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Lint
        run: bun run lint

      - name: Typecheck
        run: bun run typecheck

      - name: Test (with coverage)
        run: bun test --coverage --coverage-reporter=lcov

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v7
        with:
          files: coverage/lcov.info
          fail_ci_if_error: false

  docker:
    name: Docker build & scan
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@v7

      - uses: docker/setup-buildx-action@v4

      # Releases rewrite x-casaos.version in this file (#49); keep it a valid
      # compose file so the store never receives a broken template.
      - name: Validate the CasaOS template
        run: docker compose -f templates/casaos/dockroute/docker-compose.yml config -q

      - name: Build image (no push)
        uses: docker/build-push-action@v7
        with:
          context: .
          push: false
          load: true
          tags: dockroute:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max
          # Never cache the release stage: its apt-get upgrade must see new CVE fixes
          no-cache-filters: release

      - name: Scan image with Trivy
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: dockroute:ci
          format: sarif
          output: trivy.sarif
          severity: CRITICAL,HIGH
          ignore-unfixed: true

      - name: Upload Trivy results to GitHub Security
        uses: github/codeql-action/upload-sarif@v4
        if: always()
        with:
          sarif_file: trivy.sarif
          category: trivy-image

      - name: Fail on fixable CRITICAL/HIGH vulnerabilities
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: dockroute:ci
          format: table
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          exit-code: "1"

  integration:
    name: Integration (socket proxy)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: docker/setup-buildx-action@v4

      - name: Build image (no push)
        uses: docker/build-push-action@v7
        with:
          context: .
          push: false
          load: true
          tags: dockroute:ci
          cache-from: type=gha

      # Runs the README's socket-proxy compose example against the runner's
      # Docker engine: discovery through the proxy, no Docker group for the
      # app, and every endpoint beyond the three DockRoute uses denied.
      - name: Socket-proxy end-to-end check
        run: test/integration/socket-proxy.sh
